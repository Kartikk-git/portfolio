name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript Strict)
        run: npx tsc --noEmit

      - name: Build Static Export
        run: npm run build

      - name: Verify Export Artifacts
        run: |
          test -f out/index.html
          test -f out/projects/tejovik.html
          test -f out/projects/student-organizer.html
          test -f out/sitemap.xml
          test -f out/robots.txt

